<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBB → MP4</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f6fa; color: #172b45; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 680px; margin: 10vh auto; padding: 0 20px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px #172b450c; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #53657b; margin: 0 0 24px; }
    label { font-weight: 600; display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; border: 1px solid #a8b7c9; border-radius: 8px; font: inherit; }
    input:focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
    button, .download { display: inline-block; background: #1d4ed8; color: white; border: 0; border-radius: 8px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    button { margin-top: 16px; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    #status:empty { display: none; }
    .download { margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Запись BBB в MP4</h1>
    <p>Вставьте ссылку на опубликованную запись. После завершения конвертации появится ссылка на скачивание.</p>
    <form id="form">
      <label for="url">Playback URL</label>
      <input id="url" name="url" type="url" required placeholder="https://bbb.example.com/playback/presentation/2.3/…">
      <button id="submit" type="submit">Конвертировать</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
</main>
<script>
  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const button = document.getElementById('submit');
  let timer;
  function show(message, download) {
    status.replaceChildren(document.createTextNode(message));
    if (download) {
      const br = document.createElement('br');
      const link = document.createElement('a');
      link.href = download;
      link.className = 'download';
      link.textContent = 'Скачать MP4';
      status.append(br, link);
    }
  }
  async function check(id) {
    try {
      const response = await fetch('/jobs/' + encodeURIComponent(id), {cache: 'no-store'});
      const job = await response.json();
      if (!response.ok) { sessionStorage.removeItem('job'); button.disabled = false; show('Задание не найдено. Возможно, сервис был перезапущен.'); return; }
      if (job.status === 'done') { button.disabled = false; show('Конвертация завершена.', job.download); }
      else if (job.status === 'failed') { sessionStorage.removeItem('job'); button.disabled = false; show(job.error); }
      else { button.disabled = true; show(job.status === 'queued' ? 'Задание в очереди.' : 'Идёт конвертация. Это может занять время записи.'); timer = setTimeout(() => check(id), 3000); }
    } catch (_) { show('Нет связи с сервисом. Повторная попытка…'); timer = setTimeout(() => check(id), 5000); }
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    clearTimeout(timer);
    button.disabled = true;
    show('Отправка задания…');
    try {
      const response = await fetch('/jobs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url: document.getElementById('url').value})});
      const result = await response.json();
      if (!response.ok) { button.disabled = false; show(result.error); return; }
      sessionStorage.setItem('job', result.id);
      check(result.id);
    } catch (_) { button.disabled = false; show('Не удалось отправить задание.'); }
  });
  const previous = sessionStorage.getItem('job');
  if (previous) check(previous);
</script>
</body>
</html>
